<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CentralVex Admin — Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <h2>CENTRAL<span>VEX</span> <span class="role-badge" id="roleBadge"></span></h2>
    <div class="profile-menu-wrap">
      <button class="profile-btn" id="profileBtn" aria-label="Menu profil">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="8" r="4" stroke="#F2E9E4" stroke-width="1.6"/>
          <path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="#F2E9E4" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="profile-dropdown-item" id="menuUsername" style="color:var(--muted);font-size:12px"></div>
        <button class="profile-dropdown-item" id="menuAddChild">Tambah Akun Anak</button>
        <button class="profile-dropdown-item" id="menuAddAdmin" style="display:none">Tambah Admin</button>
        <button class="profile-dropdown-item" id="menuLogout">Keluar</button>
      </div>
    </div>
  </div>

  <div class="container">
    <img src="banner.jpg" class="banner" alt="banner" onerror="this.style.display='none'">

    <!-- Modal: Tambah Akun Anak (owner & admin) -->
    <div class="modal-overlay" id="addChildModal">
      <div class="modal-box">
        <h3>Tambah Akun Anak</h3>
        <label>Nama anak / label device</label>
        <input type="text" id="childLabel" placeholder="mis. HP Budi">
        <label>Username untuk login anak</label>
        <input type="text" id="childUsername" placeholder="Username">
        <label>Password</label>
        <input type="password" id="childPassword" placeholder="Password">
        <div class="modal-actions">
          <button class="mini" id="submitAddChild">Simpan</button>
          <button class="mini secondary" id="cancelAddChild">Batal</button>
        </div>
        <p class="error" id="addChildError"></p>
      </div>
    </div>

    <!-- Modal: Tambah Admin (owner only) -->
    <div class="modal-overlay" id="addAdminModal">
      <div class="modal-box">
        <h3>Tambah Admin</h3>
        <label>Username</label>
        <input type="text" id="newAdminUser" placeholder="Username admin baru">
        <label>Password</label>
        <input type="password" id="newAdminPass" placeholder="Password">
        <div class="modal-actions">
          <button class="mini" id="submitAddAdmin">Simpan</button>
          <button class="mini secondary" id="cancelAddAdmin">Batal</button>
        </div>
        <p class="error" id="addAdminError"></p>
      </div>
    </div>

    <div class="section-title">Daftar Device</div>
    <div id="deviceIslandList"></div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
