name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'child-app-android/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > child-app-android/local.properties

      - name: Verify google-services.json secret exists
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON kosong atau belum diset!"
            exit 1
          fi

      - name: Restore google-services.json from secret
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > child-app-android/app/google-services.json

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: child-app-android
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NOIRXBOOST-debug-apk
          path: child-app-android/app/build/outputs/apk/debug/*.apk
