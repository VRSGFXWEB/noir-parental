name: Extract ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'noir-parental-control.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip (kecuali folder .github)
        run: |
          unzip -o "noir-parental-control.zip" -d /tmp/extracted
          rm -rf /tmp/extracted/.github
          cp -r /tmp/extracted/. .

      - name: Debug - lihat isi folder
        run: ls -la

      - name: Commit hasil extract
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Extract project zip" || echo "Tidak ada perubahan"
          git push
