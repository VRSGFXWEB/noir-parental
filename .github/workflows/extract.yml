name: Extract ZIP
on:
  workflow_dispatch:
  push:
    paths:
      - 'noir-parental-control.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: unzip -o "noir-parental-control.zip" -d .

      - name: Debug - lihat isi folder
        run: |
          echo "=== Isi root ==="
          ls -la
          echo "=== Cari folder child-app-android ==="
          find . -type d -name "child-app-android"

      - name: Commit hasil extract
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Extract project zip" || echo "Tidak ada perubahan"
          git push
